# Every test suite on the two platforms the kit supports; main is the release every autoUpdate project installs from.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows is advisory until its fixtures run under Git Bash (issue #59): a red main means ubuntu
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # Git Bash on windows: the hooks, their tests and test-all's bash spawns all run there
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # jq and Git Bash are preinstalled on both runners; the hooks need jq, the test runner spawns bash
      - run: jq --version && bash --version | head -n 1
      - run: node scripts/test-all.mjs
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning hooks/*.sh githooks/pre-commit githooks/commit-msg scripts/review-needed.sh
